name: AI-SDLC QA Gate

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

concurrency:
  group: ai-sdlc-qa-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  qa:
    if: github.event.label.name == 'state:qa'
    runs-on: ubuntu-latest
    steps:
      - name: Live-state guard
        id: guard
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          script: |
            const n = context.payload.issue.number;
            const {data: issue} = await github.rest.issues.get({owner: context.repo.owner, repo: context.repo.repo, issue_number:n});
            const labels = issue.labels.map(x => typeof x === 'string' ? x : x.name);
            const runnable = issue.state === 'open' && labels.includes('state:qa') && labels.includes('agent:qa') && !labels.includes('ai:stop');
            core.setOutput('run', runnable ? 'true' : 'false');
            if (!runnable) core.notice(`Skipping stale/stopped QA event for issue #${n}; labels=${labels.join(',')}`);

      - name: Checkout control plane
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve implementation PR
        if: steps.guard.outputs.run == 'true'
        id: resolve
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          script: |
            const n = context.payload.issue.number;
            const {data: comments} = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: n, per_page: 100});
            const text = [...comments].reverse().map(c => c.body || '').join('\n');
            const m = text.match(/Implementation PR (?:created|ready for independent review):\s*(https:\/\/github\.com\/([^/]+\/[^/]+)\/pull\/(\d+))/);
            if (!m) { core.setFailed('No implementation PR found in work-item comments'); return; }
            core.setOutput('pr_url', m[1]);
            core.setOutput('repo', m[2]);
            core.setOutput('pr_number', m[3]);
            core.setOutput('issue_number', String(n));

      - name: Fetch work item and PR/CI evidence
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          TARGET_REPO: ${{ steps.resolve.outputs.repo }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          gh api "/repos/${{ github.repository }}/issues/$ISSUE_NUMBER" --jq '.body' > /tmp/primeqa-work-item.md
          gh api "/repos/$TARGET_REPO/pulls/$PR_NUMBER" > /tmp/pr.json
          gh api "/repos/$TARGET_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | {filename,status,additions,deletions,changes,patch}' > /tmp/pr-files.jsonl
          SHA=$(jq -r '.head.sha' /tmp/pr.json)
          gh api "/repos/$TARGET_REPO/commits/$SHA/check-runs" > /tmp/checks.json || echo '{"check_runs":[]}' > /tmp/checks.json
          jq '{total_count, checks: [.check_runs[] | {name,status,conclusion,html_url}]}' /tmp/checks.json > /tmp/ci-summary.json

      - name: Checkout PR merge result
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.resolve.outputs.repo }}
          ref: refs/pull/${{ steps.resolve.outputs.pr_number }}/merge
          token: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          path: _target
          persist-credentials: false
          fetch-depth: 0

      - name: Independent QA assessment
        if: steps.guard.outputs.run == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-schema: |
            {"type":"object","properties":{"decision":{"type":"string","enum":["pass","changes_required","human_required"]},"summary":{"type":"string"},"evidence":{"type":"array","items":{"type":"string"}},"gaps":{"type":"array","items":{"type":"string"}}},"required":["decision","summary","evidence","gaps"],"additionalProperties":false}
          prompt: |
            You are the independent QA Analyst for Prime QA. Do not modify files.
            Read AGENTS.md, requirements/technical-requirements.md, ai-sdlc/definition-of-done.md,
            /tmp/primeqa-work-item.md, /tmp/pr-files.jsonl and /tmp/ci-summary.json. Inspect the implementation under _target.
            Determine whether acceptance criteria have adequate automated/unit/API/UI/integration coverage for the change,
            whether existing checks provide credible evidence, and whether regression/error/security-relevant behavior is tested.
            Do not pass merely because CI is green. Return changes_required for implementable test/quality gaps and
            human_required only for a genuine decision/environment dependency that cannot be resolved from evidence.

      - name: Update work-item state
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          QA_JSON: ${{ steps.codex.outputs.final-message }}
          PR_URL: ${{ steps.resolve.outputs.pr_url }}
        run: |
          LIVE_LABELS=$(gh api "/repos/${{ github.repository }}/issues/$ISSUE_NUMBER" --jq '[.labels[].name] | join(",")')
          if [[ ",$LIVE_LABELS," == *",ai:stop,"* ]] || [[ ",$LIVE_LABELS," != *",state:qa,"* ]] || [[ ",$LIVE_LABELS," != *",agent:qa,"* ]]; then
            echo "Stale/stopped QA run; labels=$LIVE_LABELS"
            exit 0
          fi
          printf '%s' "$QA_JSON" > /tmp/qa.json
          DECISION=$(jq -r '.decision' /tmp/qa.json)
          SUMMARY=$(jq -r '.summary' /tmp/qa.json)
          EVIDENCE=$(jq -r '.evidence[]? | "- " + .' /tmp/qa.json)
          GAPS=$(jq -r '.gaps[]? | "- " + .' /tmp/qa.json)
          printf '## AI-SDLC QA gate\n\n**Decision:** %s\n\n%s\n\n### Evidence\n%s\n\n### Gaps\n%s\n\nPR: %s\n' "$DECISION" "$SUMMARY" "$EVIDENCE" "$GAPS" "$PR_URL" > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md
          for label in state:qa agent:qa ai:running ai:ready; do gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --remove-label "$label" >/dev/null 2>&1 || true; done
          case "$DECISION" in
            pass)
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --remove-label ai:retry >/dev/null 2>&1 || true
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:verification,agent:auditor' >/dev/null ;;
            changes_required)
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:implementation,agent:developer,ai:retry' >/dev/null ;;
            human_required)
              gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:human-decision,human:required' >/dev/null ;;
          esac
