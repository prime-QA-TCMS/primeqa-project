name: AI-SDLC Objective Verification

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

concurrency:
  group: ai-sdlc-verification-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.label.name == 'state:verification'
    runs-on: ubuntu-latest
    steps:
      - name: Live-state guard
        id: guard
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          script: |
            const n = context.payload.issue.number;
            const {data: issue} = await github.rest.issues.get({owner: context.repo.owner, repo: context.repo.repo, issue_number: n});
            const labels = issue.labels.map(x => typeof x === 'string' ? x : x.name);
            const runnable = issue.state === 'open'
              && labels.includes('state:verification')
              && labels.includes('agent:auditor')
              && !labels.includes('ai:stop')
              && !labels.includes('state:done')
              && !labels.includes('state:human-decision')
              && !labels.includes('state:implementation')
              && !labels.includes('state:review')
              && !labels.includes('state:qa');
            core.setOutput('run', runnable ? 'true' : 'false');
            if (!runnable) core.notice(`Skipping stale/stopped verification event for issue #${n}; current labels: ${labels.join(', ')}`);

      - name: Checkout control plane
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve work item and implementation PR
        if: steps.guard.outputs.run == 'true'
        id: resolve
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          script: |
            const n = context.payload.issue.number;
            const {data: issue} = await github.rest.issues.get({owner: context.repo.owner, repo: context.repo.repo, issue_number: n});
            const labels = issue.labels.map(x => typeof x === 'string' ? x : x.name);
            const {data: comments} = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: n, per_page: 100});
            const text = [...comments].reverse().map(c => c.body || '').join('\n');
            const m = text.match(/Implementation PR (?:created|ready for independent review):\s*(https:\/\/github\.com\/([^/]+\/[^/]+)\/pull\/(\d+))/);
            if (!m) { core.setFailed('No implementation PR found'); return; }
            const section = (heading) => {
              const body = issue.body || '';
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp(`### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`,'i');
              const match = body.match(re);
              return match ? match[1].trim() : '';
            };
            core.setOutput('issue_number', String(n));
            core.setOutput('pr_url', m[1]);
            core.setOutput('repo', m[2]);
            core.setOutput('pr_number', m[3]);
            core.setOutput('risk', section('Risk').toLowerCase());
            core.setOutput('shared', labels.includes('shared-package') ? 'true' : 'false');

      - name: Fetch complete verification evidence
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          TARGET_REPO: ${{ steps.resolve.outputs.repo }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          gh api "/repos/${{ github.repository }}/issues/$ISSUE_NUMBER" --jq '.body' > /tmp/primeqa-work-item.md
          gh api "/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[] | {created_at,body}' > /tmp/work-item-comments.jsonl
          gh api "/repos/$TARGET_REPO/pulls/$PR_NUMBER" > /tmp/pr.json
          gh api "/repos/$TARGET_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | {filename,status,additions,deletions,changes,patch}' > /tmp/pr-files.jsonl
          gh api "/repos/$TARGET_REPO/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | {created_at,body}' > /tmp/pr-comments.jsonl || true
          gh api "/repos/$TARGET_REPO/pulls/$PR_NUMBER/reviews?per_page=100" --jq '.[] | {state,submitted_at,body,user:.user.login}' > /tmp/pr-reviews.jsonl || true
          SHA=$(jq -r '.head.sha' /tmp/pr.json)
          gh api "/repos/$TARGET_REPO/commits/$SHA/check-runs" > /tmp/checks.json || echo '{"check_runs":[]}' > /tmp/checks.json
          jq '{total_count, checks: [.check_runs[] | {name,status,conclusion,html_url}]}' /tmp/checks.json > /tmp/ci-summary.json

      - name: Checkout implementation PR with full history
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.resolve.outputs.repo }}
          ref: refs/pull/${{ steps.resolve.outputs.pr_number }}/merge
          token: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          path: _target
          persist-credentials: false
          fetch-depth: 0

      - name: Produce deterministic diff evidence
        if: steps.guard.outputs.run == 'true'
        working-directory: _target
        run: |
          git diff --name-status HEAD^1...HEAD > /tmp/pr-name-status.txt || true
          git diff --stat HEAD^1...HEAD > /tmp/pr-diff-stat.txt || true

      - name: Objective Auditor
        if: steps.guard.outputs.run == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-schema: |
            {"type":"object","properties":{"decision":{"type":"string","enum":["pass","implementation_failure","evidence_failure","human_required"]},"evidence_route":{"type":"string","enum":["none","review","qa","verification","human"]},"summary":{"type":"string"},"acceptance_evidence":{"type":"array","items":{"type":"string"}},"missing_evidence":{"type":"array","items":{"type":"string"}}},"required":["decision","evidence_route","summary","acceptance_evidence","missing_evidence"],"additionalProperties":false}
          prompt: |
            You are the Objective Auditor, the final independent verification context in the Prime QA AI-SDLC.
            Do not edit code. Read AGENTS.md, requirements/technical-requirements.md,
            ai-sdlc/definition-of-done.md, ai-sdlc/permissions-and-gates.md, /tmp/primeqa-work-item.md,
            /tmp/work-item-comments.jsonl, /tmp/pr-comments.jsonl, /tmp/pr-reviews.jsonl,
            /tmp/pr-files.jsonl, /tmp/ci-summary.json, /tmp/pr-name-status.txt and /tmp/pr-diff-stat.txt.
            Inspect _target. Verify the observable acceptance criteria and Definition of Done using the complete evidence set.
            Return pass only when implementation and evidence are sufficient.
            Return implementation_failure only for a remediable defect in the implementation itself.
            Return evidence_failure when implementation may be correct but a required review/QA/CI/traceability artifact is missing or insufficient.
            For evidence_failure set evidence_route to review, qa, or verification depending on which gate should regenerate evidence.
            Return human_required only for unresolved product/security/destructive decisions or evidence that cannot be obtained autonomously.

      - name: Complete, reroute, or escalate
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIMEQA_AUTOMATION_TOKEN }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          TARGET_REPO: ${{ steps.resolve.outputs.repo }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_URL: ${{ steps.resolve.outputs.pr_url }}
          RISK: ${{ steps.resolve.outputs.risk }}
          SHARED: ${{ steps.resolve.outputs.shared }}
          VERDICT_JSON: ${{ steps.codex.outputs.final-message }}
        run: |
          LIVE_STATE=$(gh api "/repos/${{ github.repository }}/issues/$ISSUE_NUMBER" --jq '.state')
          LIVE_LABELS=$(gh api "/repos/${{ github.repository }}/issues/$ISSUE_NUMBER" --jq '[.labels[].name] | join(",")')
          if [ "$LIVE_STATE" != 'open' ] || [[ ",$LIVE_LABELS," == *",ai:stop,"* ]] || [[ ",$LIVE_LABELS," != *",state:verification,"* ]] || [[ ",$LIVE_LABELS," != *",agent:auditor,"* ]]; then
            echo "Stale/stopped verification run; current state=$LIVE_STATE labels=$LIVE_LABELS. Exiting without mutation."
            exit 0
          fi

          printf '%s' "$VERDICT_JSON" > /tmp/verdict.json
          DECISION=$(jq -r '.decision' /tmp/verdict.json)
          ROUTE=$(jq -r '.evidence_route' /tmp/verdict.json)
          SUMMARY=$(jq -r '.summary' /tmp/verdict.json)
          EVIDENCE=$(jq -r '.acceptance_evidence[]? | "- " + .' /tmp/verdict.json)
          MISSING=$(jq -r '.missing_evidence[]? | "- " + .' /tmp/verdict.json)
          printf '## Objective verification\n\n**Decision:** %s\n**Route:** %s\n\n%s\n\n### Acceptance evidence\n%s\n\n### Missing evidence\n%s\n\nPR: %s\n' "$DECISION" "$ROUTE" "$SUMMARY" "$EVIDENCE" "$MISSING" "$PR_URL" > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md
          for label in state:verification agent:auditor ai:running ai:ready; do gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --remove-label "$label" >/dev/null 2>&1 || true; done

          case "$DECISION" in
            implementation_failure) gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:implementation,agent:developer,ai:retry' >/dev/null; exit 0 ;;
            evidence_failure)
              case "$ROUTE" in
                review) gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:review,agent:reviewer' >/dev/null ;;
                qa) gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:qa,agent:qa' >/dev/null ;;
                verification|none) gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:verification,agent:auditor' >/dev/null ;;
                *) gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:human-decision,human:required' >/dev/null ;;
              esac
              exit 0 ;;
            human_required) gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:human-decision,human:required' >/dev/null; exit 0 ;;
          esac

          case "$RISK" in critical*|high*) HUMAN=1 ;; *) HUMAN=0 ;; esac
          if [ "$SHARED" = 'true' ]; then HUMAN=1; fi
          if [ "$HUMAN" = '1' ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:human-decision,human:required' >/dev/null
            gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "All automated gates passed. Human merge approval is required because this item is high/critical risk or changes a shared package."
            exit 0
          fi

          gh pr ready "$PR_NUMBER" --repo "$TARGET_REPO" >/dev/null 2>&1 || true
          if gh pr merge "$PR_NUMBER" --repo "$TARGET_REPO" --squash --delete-branch; then
            for label in state:implementation state:review state:qa state:verification state:human-decision state:blocked agent:developer agent:reviewer agent:qa agent:auditor ai:retry human:required ai:running ai:ready; do gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --remove-label "$label" >/dev/null 2>&1 || true; done
            gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:done' >/dev/null
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --comment "All AI-SDLC gates passed and $PR_URL was squash-merged. Work item complete."
          else
            gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label 'state:human-decision,human:required' >/dev/null
            gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "All automated gates passed, but GitHub could not complete the merge (for example branch protection or repository policy). Human action is required."
          fi
